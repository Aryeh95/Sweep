# Build artefacts from source, on every push to master:
#
#   1. the kiosk bundle (client/dist). It is COMMITTED — every kiosk serves
#      it straight from `git pull` — and until this workflow existed it was
#      built by hand on the maintainer's machine, which shipped a stale
#      bundle once (CLAUDE.md, "The committed bundle can be a build of older
#      source"). Now CI rebuilds it after every source push and commits the
#      result back when it differs, so the committed bundle is always the
#      build of the committed source, on one platform (terser's mangling
#      differs between macOS and Linux, which is why CI could never
#      byte-compare a hand-built bundle).
#
#   2. the signed Android APK. The upload key used to live only on the
#      machine that built the last APK; here it is decoded from repository
#      secrets, so any push can produce an installable update that Android
#      accepts as the same app. Uploaded as a workflow artefact on every
#      run, and published to a GitHub Release tagged app-v<versionName> —
#      created on first sight of a version in app/android/app/build.gradle
#      and updated in place on rebuilds of the same version.
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of app/android/app/sweep-release.jks
#   ANDROID_KEYSTORE_PASSWORD storePassword from keystore.properties
#   ANDROID_KEY_ALIAS         keyAlias from keystore.properties
#   ANDROID_KEY_PASSWORD      keyPassword from keystore.properties
# Without them the APK job builds nothing and says so; the bundle job is
# unaffected.

name: Build

on:
  push:
    branches: [master]
    # The bundle job's own commit says [skip ci]; this is the belt to that
    # brace, so a dist-only push can never start another build.
    paths-ignore:
      - "client/dist/**"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: kiosk bundle (client/dist)
    runs-on: ubuntu-latest
    outputs:
      dist_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Push back with the workflow token; branch protection must allow
          # it (or grant a PAT here instead).
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run prod
        working-directory: client
      - name: Commit the rebuilt bundle when it differs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync with origin/master before committing in case back-to-back
          # pushes advanced master while this job was queued or building.
          BUILT_AT="$(git rev-parse HEAD)"
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$BUILT_AT" ]; then
            echo "origin/master advanced from ${BUILT_AT} — rebasing and rebuilding client/dist..."
            git checkout -- client/dist
            git clean -fd client/dist
            git pull --rebase origin master
            (cd client && npm ci && npm run prod)
          fi

          if git diff --quiet -- client/dist && [ -z "$(git status --porcelain -- client/dist)" ]; then
            echo "client/dist already matches the source ✓"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -A client/dist
          git commit -m "Rebuild client bundle from $(git rev-parse --short HEAD) [skip ci]"
          if ! git push origin HEAD:master; then
            echo "Push raced with a new commit on master — rebasing once and rebuilding..."
            git reset --soft HEAD~1
            git restore --staged client/dist
            git checkout -- client/dist
            git clean -fd client/dist
            git pull --rebase origin master
            (cd client && npm ci && npm run prod)
            if ! git diff --quiet -- client/dist || [ -n "$(git status --porcelain -- client/dist)" ]; then
              git add -A client/dist
              git commit -m "Rebuild client bundle from $(git rev-parse --short HEAD) [skip ci]"
              git push origin HEAD:master
            fi
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "::notice::client/dist rebuilt and committed"

  apk:
    name: signed Android APK
    runs-on: ubuntu-latest
    needs: bundle
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bundle.outputs.dist_sha }}
      - name: Check signing secrets
        id: secrets
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::One or more ANDROID_* signing secrets are not set — skipping the APK build. Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD to enable it."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            app/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.secrets.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Build the app web bundle
        if: steps.secrets.outputs.present == 'true'
        # The app runs the server controllers in-process (standalone/api.js
        # imports ../server/*), so webpack resolves their dependencies —
        # nexrad-level-3-data, h5wasm, axios — from the ROOT node_modules.
        run: |
          npm ci
          cd client
          npm ci
          npm run app:build
      - name: Sync into the Android project
        if: steps.secrets.outputs.present == 'true'
        working-directory: app
        run: |
          npm ci
          npx cap sync android
      - name: Restore the signing key
        if: steps.secrets.outputs.present == 'true'
        working-directory: app/android/app
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > sweep-release.jks
          python3 - <<'PYEOF'
          import os

          # Escape values for java.util.Properties.load(InputStream) so
          # backslashes, leading spaces, and non-ASCII characters in secrets
          # are never mangled.
          def prop_escape(val):
              out = []
              for idx, ch in enumerate(val):
                  code = ord(ch)
                  if ch == "\\":
                      out.append("\\\\")
                  elif ch == "\t":
                      out.append("\\t")
                  elif ch == "\n":
                      out.append("\\n")
                  elif ch == "\r":
                      out.append("\\r")
                  elif idx == 0 and ch == " ":
                      out.append("\\ ")
                  elif code < 0x20 or code > 0x7E:
                      out.append(f"\\u{code:04x}")
                  else:
                      out.append(ch)
              return "".join(out)

          lines = [
              "storeFile=sweep-release.jks",
              f"storePassword={prop_escape(os.environ['STORE_PASSWORD'])}",
              f"keyAlias={prop_escape(os.environ['KEY_ALIAS'])}",
              f"keyPassword={prop_escape(os.environ['KEY_PASSWORD'])}",
          ]
          with open("keystore.properties", "w", encoding="ascii") as fh:
              fh.write("\n".join(lines) + "\n")
          PYEOF
      - name: Build the release APK
        if: steps.secrets.outputs.present == 'true'
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -q
          VERSION=$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app/build.gradle | head -1)
          echo "version=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "Sweep-${VERSION}.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "Sweep-${VERSION}.apk" | grep -i "sha-256"
      - name: Remove the signing key from the runner
        if: always() && steps.secrets.outputs.present == 'true'
        working-directory: app/android/app
        run: rm -f sweep-release.jks keystore.properties
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.secrets.outputs.present == 'true'
        with:
          name: Sweep-${{ env.version }}
          path: app/android/Sweep-${{ env.version }}.apk
          if-no-files-found: error
      - name: Publish a release
        if: steps.secrets.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_SHA: ${{ needs.bundle.outputs.dist_sha }}
        working-directory: app/android
        run: |
          TAG="app-v${version}"
          NOTES="Signed release APK built from ${DIST_SHA} by the Build workflow."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG exists — replacing its APK and updating notes for ${DIST_SHA}"
            gh release upload "$TAG" "Sweep-${version}.apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "Sweep-${version}.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Sweep ${version}" \
              --notes "$NOTES" \
              --target "$DIST_SHA"
          fi
